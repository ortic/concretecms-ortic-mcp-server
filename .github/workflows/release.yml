name: Release

# Pushing a version tag (v1.2.3 or 1.2.3) creates a GitHub release with a ready-to-unzip package:
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that the tag matches the package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(bash .github/scripts/package-version.sh)"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match \$pkgVersion '$pkg_version' in controller.php"
            exit 1
          fi
      - name: Build the ZIP
        run: bash .github/scripts/build-zip.sh "$GITHUB_REF_NAME" ortic_mcp_server.zip
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" ortic_mcp_server.zip \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
