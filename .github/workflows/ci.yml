name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Check PHP syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -d display_errors=1 -l "$file" > /dev/null || status=1
          done < <(git ls-files -z '*.php')
          exit $status
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

  package:
    name: Build ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check the release ZIP
        run: bash .github/scripts/build-zip.sh HEAD ortic_mcp_server.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ortic_mcp_server
          path: ortic_mcp_server.zip
          if-no-files-found: error

  install:
    name: Install in Concrete CMS (Composer)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: concrete
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          path: package
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, pdo_mysql, zip, mbstring, curl, dom, fileinfo
          coverage: none
          tools: composer:v2
      - name: Create a Concrete CMS site
        run: composer create-project --no-interaction --no-progress concretecms/composer site
      - name: Require the package through Composer
        working-directory: site
        run: |
          composer config repositories.package '{"type": "path", "url": "../package", "options": {"symlink": false}}'
          composer require --no-interaction --no-progress 'ortic/concretecms-ortic-mcp-server:*@dev'
          test -f public/packages/ortic_mcp_server/controller.php
      - name: Install Concrete CMS
        working-directory: site
        run: |
          mkdir -p public/application/files
          vendor/bin/concrete c5:install --no-interaction \
            --db-server=127.0.0.1 --db-username=root --db-password=root --db-database=concrete \
            --site="MCP CI" --starting-point=atomik_full \
            --admin-email=admin@example.com --admin-password='Ci-0nly-Passw0rd!' \
            --canonical-url=http://127.0.0.1:8080/
      - name: Install the package
        working-directory: site
        run: vendor/bin/concrete c5:package:install ortic_mcp_server
      - name: Check the MCP endpoint
        working-directory: site
        run: |
          php -S 127.0.0.1:8080 -t public > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8080/index.php && break
            sleep 1
          done
          bash ../package/.github/scripts/check-endpoint.sh http://127.0.0.1:8080/index.php || { cat server.log; exit 1; }

  # The release ZIP is what most people install: unzipped into packages/, without Composer.
  # The package's classes then load only through $pkgAutoloaderRegistries in controller.php.
  install-zip:
    name: Install ZIP in Concrete ${{ matrix.concrete }} (PHP ${{ matrix.php }})
    needs: package
    runs-on: ubuntu-latest
    container: ghcr.io/concrete5-community/docker5:${{ matrix.concrete }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported versions ($appVersionRequired and $phpVersionRequired in controller.php)...
          - concrete: '9.5.0'
            php: '8.1'
          # ...and the newest ones.
          - concrete: latest
            php: '8.5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ortic_mcp_server
      - name: Start PHP ${{ matrix.php }}, the database and the web server
        run: |
          switch-php ${{ matrix.php }}
          ccm-service start db php-fpm nginx
      - name: Unzip the package
        run: |
          unzip -q ortic_mcp_server.zip -d /app/packages
          chown -R www-data:www-data /app/packages/ortic_mcp_server
      - name: Install the package
        run: sudo -u www-data /app/concrete/bin/concrete --no-interaction c5:package:install ortic_mcp_server
      - name: Check the MCP endpoint
        run: bash .github/scripts/check-endpoint.sh http://localhost/index.php

  xml:
    name: XML schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install xmllint
        run: |
          if ! command -v xmllint > /dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends libxml2-utils
          fi
      # Concrete reads db.xml without checking it against the schema, so mistakes would go unnoticed.
      - name: Validate db.xml against the doctrine-xml schema
        run: |
          curl -sSfL -o "$RUNNER_TEMP/doctrine-xml-0.5.xsd" https://concretecms.github.io/doctrine-xml/doctrine-xml-0.5.xsd
          xmllint --noout --schema "$RUNNER_TEMP/doctrine-xml-0.5.xsd" db.xml
      # The CIF schema uses XML Schema 1.1, which xmllint does not support.
      - name: Validate install.xml against the CIF schema
        run: |
          curl -sSfL -o "$RUNNER_TEMP/concrete-cif.jar" https://github.com/concretecms/concrete-cif/releases/latest/download/concrete-cif.jar
          java -jar "$RUNNER_TEMP/concrete-cif.jar" install.xml
